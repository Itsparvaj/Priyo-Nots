name: Build Priyo Nots APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.1) to publish under GitHub Releases'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version metadata
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            TAG_NAME="${{ inputs.release_tag }}"
          else
            TAG_NAME="v1.0.0"
          fi
          CLEAN_VER="${TAG_NAME#v}"
          CLEAN_VER="${CLEAN_VER#V}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${CLEAN_VER//[^0-9.]/}"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          VER_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "RELEASE_TAG=$TAG_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$CLEAN_VER" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$VER_CODE" >> "$GITHUB_ENV"
          echo "Building Priyo Nots $TAG_NAME (versionName=$CLEAN_VER, versionCode=$VER_CODE)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Android SDK & accept licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDK_MANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "Using sdkmanager: $SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          "$SDK_MANAGER" "platforms;android-36.1" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Cache generated debug keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: priyo-nots-debug-keystore-v1

      - name: Restore or generate debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore debug.keystore -storepass android | grep -E "SHA1:|SHA256:" || true

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/PriyoNots-v${APP_VERSION_NAME}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PriyoNots-APK
          path: dist/PriyoNots-v*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Priyo Nots ${{ env.RELEASE_TAG }}
          make_latest: true
          body: |
            Installable Android APK for **Priyo Nots ${{ env.RELEASE_TAG }}** (Owner: Mohammad Parvaj).
            Tap **Update Now** inside Priyo Nots or download the `.apk` asset below to update directly.
          files: dist/PriyoNots-v*.apk
